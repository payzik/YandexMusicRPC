name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev tools
        run: python -m pip install "pytest>=9,<10" ruff mypy keyring pydantic
      - name: Ruff lint
        run: python -m ruff check .
      - name: Mypy type check
        run: python -m mypy
      - name: Pytest
        run: python -m pytest tests
